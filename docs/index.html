<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram運用</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form">
    <h1>Instagram運用</h1>
    <label>メールアドレス<input type="email" name="email" required autocomplete="email"></label>
    <button class="btn primary" type="submit">ログイン用のリンクを送る</button>
    <p class="muted" id="login-msg"></p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="header-row">
      <nav class="accounts" id="accounts"></nav>
      <button class="link" id="logout">ログアウト</button>
    </div>
    <nav class="views" id="views"></nav>
  </header>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
