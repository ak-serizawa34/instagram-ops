<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insta Studio｜画像の型の見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .controls { display: grid; gap: 14px; max-width: 560px; margin-bottom: 36px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
  .row h3 { font-family: var(--mincho); font-size: 16px; margin: 0 0 10px; }
  canvas { width: 100%; height: auto; border-radius: 10px; box-shadow: 0 10px 30px -18px rgba(0,0,0,.4); display: block; }
  .format-title { font-family: var(--mincho); font-size: 22px; margin: 0 0 16px; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <div class="section-head"><h1 class="section-title">画像の型の見本</h1></div>
  <div class="controls">
    <label>写真を選ぶ（アップロードはされません）<input type="file" id="photo" accept="image/*"></label>
    <label>一言<textarea id="text">ここに一言が入ります。
二行目もこのように並びます。</textarea></label>
    <label>添え書き<input id="sub" value="愛鷹テロワール"></label>
  </div>
  <h2 class="format-title">カルーセル（4：5）</h2>
  <div class="row" id="feed"></div>
  <h2 class="format-title">ストーリーズ（9：16）</h2>
  <div class="row" id="story"></div>
</main>
<script src="templates.js"></script>
<script>
  let image = null;
  async function renderAll() {
    const text = document.getElementById('text').value;
    const sub = document.getElementById('sub').value;
    for (const format of ['feed', 'story']) {
      const row = document.getElementById(format);
      row.innerHTML = '';
      for (const t of Templates.list) {
        const box = document.createElement('div');
        box.innerHTML = `<h3>${t.name}</h3>`;
        const c = document.createElement('canvas');
        box.appendChild(c);
        row.appendChild(box);
        await Templates.draw(c, { template: t.id, format, image, text, sub });
      }
    }
  }
  document.getElementById('photo').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => { image = img; renderAll(); };
    img.src = URL.createObjectURL(f);
  });
  document.getElementById('text').addEventListener('input', renderAll);
  document.getElementById('sub').addEventListener('input', renderAll);
  renderAll();
</script>
</body>
</html>
